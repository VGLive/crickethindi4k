<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; outline: none; object-fit: contain; }
    </style>
</head>
<body>

    <video id="video" controls autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('video');
        
        // 1. The blocked target stream
        const streamUrl = "https://vt-ip.vodep39240327.workers.dev/2010.m3u8";
        
        // 2. Your Cloudflare Worker Proxy Base
        const proxyBase = "https://stream-proxy.vgtv.workers.dev/";

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 30,
                // THIS IS THE MAGIC: It forces every network request through your proxy
                xhrSetup: function(xhr, url) {
                    // Prevent double-proxying
                    if (!url.startsWith(proxyBase)) {
                        xhr.open('GET', proxyBase + url, true);
                    }
                }
            });
            
            // Load the stream (the xhrSetup intercepts it automatically)
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => console.log("Click play to start video."));
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error("Stream Error:", data.type, "| Details:", data.details);
                    if (data.response) {
                        console.error("HTTP Status Code:", data.response.code);
                    }
                }
            });
            
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback for Safari/iOS
            video.src = proxyBase + streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(() => console.log("Click play to start video."));
            });
        }
    </script>

</body>
</html>
